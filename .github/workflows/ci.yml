name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KalTerm.sln

      - name: Format check
        run: dotnet format KalTerm.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build KalTerm.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution KalTerm.sln --configuration Release --no-build
          --coverlet --coverlet-output-format cobertura
          --report-trx --results-directory TestResults

      - name: Coverage gate
        shell: pwsh
        run: ./tools/ci/check-coverage.ps1 -Path TestResults -MinLinePercent 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
